[package]
name = "navwhisper-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "navwhisper"
path = "src/main.rs"

[dependencies]
navwhisper-core = { path = "../navwhisper-core" }
hound = "3.5"
rusqlite = { version = "0.41.0", features = ["bundled"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
clap = { version = "4.6.7", features = ["derive"] }
cpal = { version = "0.18.2", features = ["realtime"] }
ctrlc = "3.5.2"
